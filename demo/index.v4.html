<style>
/* Layout: a single magazine column (max 1280px); a live corridor figure opens the article, then the lab, the results figure and the findings. */
:root{
  --paper:#FDFBF6; --paper-2:#F2EDF3; --surface:#FFFFFF; --ink:#1D1022; --ink-2:#3D2F45; --muted:#62566E; --rule:#DCD2E0;
  --accent:#560F6D; --accent-ink:#FFFFFF; --accent-soft:#F1E6F4; --accent-2:#3B0A4B;
  --night:#1C0426; --sun:#FBFEA3; --rasp:#BB3653; --pink:#E75E88; --orange:#F88E07;
  --ok:#1F6E45; --ok-ink:#1A5C3A; --ok-soft:#DCEADF;
  --wait:#C98A12; --wait-ink:#7D5200; --wait-soft:#F5E6C4;
  --bad:#BB3653; --bad-ink:#9A2742; --bad-soft:#F8E1E6;
  --backup:#9466AE; --backup-ink:#663A80; --backup-soft:#EEE4F4;
  --guess:#E07B00; --guess-ink:#8F4C00; --guess-soft:#FDEBD2;
  --h0:#F5F0F6; --h1:#F6D9B0; --h2:#EFA55E; --h3:#D0587A; --dot:#1D1022;
  --band:rgba(187,54,83,.25);
  --pixel:"Jersey 10","IBM Plex Mono",ui-monospace,monospace;
  --display:"Noto Naskh Arabic","Amiri",Georgia,serif;
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif-en:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
html[lang="en"]{--display:"Newsreader",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;overflow-x:clip;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.page{padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1280px;margin:0 auto;display:flex;flex-direction:column}
.rule-heavy{height:6px;background:var(--ink)}
.rule-double{height:4px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.alt[lang="en"]{font-family:var(--serif-en);font-style:italic}
.alt[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif;font-style:normal}
.alt{display:none!important}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px;padding-block:10px;margin-inline:calc(50% - 50vw);padding-inline:max(16px,calc(50vw - 640px));background:var(--night);color:#E9DDF0}
.mast .brand{color:#C9B6D4}
.mast .lang button{color:#C9B6D4}
.mast .lang button[aria-pressed="true"]{color:var(--sun);border-bottom-color:var(--sun)}
.mast button:focus-visible{outline-color:var(--sun)}
.wordmark{font:400 34px/1 var(--pixel);color:var(--sun);letter-spacing:.01em}
.signal{height:4px;margin-inline:calc(50% - 50vw);background:linear-gradient(90deg,var(--accent) 0 70%,var(--rasp) 70% 85%,var(--orange) 85% 100%)}
[dir="rtl"] .signal{background:linear-gradient(270deg,var(--accent) 0 70%,var(--rasp) 70% 85%,var(--orange) 85% 100%)}
.mark{display:flex;align-items:baseline;gap:12px}
.mark-ar{font:700 34px/1 "Noto Naskh Arabic",serif}
.mark-en{font:italic 400 20px var(--serif-en);color:var(--muted)}
.brand{font-size:13.5px;color:var(--muted)}
.lang{display:inline-flex;gap:4px}
.lang button{min-height:44px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:6px 14px;font-size:15px;font-weight:500;cursor:pointer}
.lang button[data-lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif}
.lang button[data-lang="en"]{font-family:var(--serif-en);font-size:16px}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

/* hero */
.hero{padding-block:48px 32px;display:flex;flex-direction:column;gap:18px}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--rasp);font-size:15px;font-weight:700}
.kicker .alt{font-weight:500}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,5.2vw,72px);line-height:1.35;max-width:16em}
html[lang="en"] h1{font-weight:500;line-height:1.04;letter-spacing:-.012em;max-width:14em}
.alt-title{margin:0;align-self:flex-end;max-width:24em;font-size:clamp(20px,2.3vw,30px);line-height:1.35;color:var(--muted);text-align:end}
.deck{display:flex;flex-wrap:wrap;gap:20px 48px;padding-block:8px 32px;border-bottom:1px solid var(--ink)}
.lead{flex:3 1 420px;min-width:0;margin:0;font-size:clamp(19px,1.7vw,22px);line-height:1.75;max-width:38em}
.alt-lead{flex:2 1 300px;min-width:0;margin:0;padding-inline-start:24px;border-inline-start:1px solid var(--rule);font-size:17.5px;line-height:1.6;color:var(--ink-2)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}

.btn{min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:2px;padding:12px 24px;font-size:17px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:background .15s}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:500}
.btn.ghost:hover{background:var(--paper-2)}
.btn svg{flex:none}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* key result (the poster's main message, kept small) */
.keyres{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:20px 0;border-bottom:1px solid var(--rule)}
.kn-row{display:flex;align-items:baseline;gap:14px}
.kn{font:400 clamp(44px,5vw,64px)/.9 var(--pixel);font-variant-numeric:tabular-nums}
.kn-bad{color:var(--rasp)}.kn-good{color:var(--accent)}
.kn-arr{font:400 32px/1 var(--pixel);color:var(--orange)}
.kn-lbl{margin:0;flex:1 1 280px;min-width:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
[dir="rtl"] .keyres .kn-lbl{direction:rtl;text-align:right}
/* figure 1 */
.fig{margin:0;padding-block:28px 0}
.fig-scroll{overflow-x:auto;direction:ltr}
.fig-box{position:relative;min-width:760px;max-width:100%;aspect-ratio:1200/500}
.fig-box canvas,.fig-box svg{position:absolute;inset:0;width:100%;height:100%}
.ann{position:absolute;display:flex;flex-direction:column;gap:2px;font-size:clamp(13.5px,1.25vw,17px);line-height:1.4}
.ann b{font-weight:700}
.ann .alt{color:var(--muted);font-size:.9em}
.ann.end{text-align:right;align-items:flex-end}
.ann.start{text-align:left;align-items:flex-start}
.figcap{display:flex;flex-wrap:wrap;gap:4px 18px;padding-block:14px 0;margin-top:6px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
.figcap b{color:var(--rasp);font:400 20px/1.2 var(--pixel)}
.figcap b:lang(ar){font:700 14px var(--sans)}
.fig2{padding-top:0}.fig2 .figcap{margin-top:28px;font-size:15px;line-height:1.6}
.refkey{display:inline-flex;align-items:center;gap:8px}.refkey i{display:inline-block;width:22px;border-top:2px dashed var(--ink);opacity:.7}
.figcap .live{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}

/* the three steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:44px;border-top:1px solid var(--ink)}
.step{padding:22px 28px;display:flex;flex-direction:column;gap:6px;border-inline-start:1px solid var(--rule)}
.step:first-child{border-inline-start:0;padding-inline-start:0}
.step .num{font:700 44px/1.1 "Noto Naskh Arabic",serif;color:var(--accent)}
html[lang="en"] .step .num{font:500 46px/1 var(--serif-en)}
.step b{font-size:20px}
.step .d{font-size:16px;line-height:1.7;color:var(--ink-2)}
.step .alt{font-size:15px;line-height:1.5;color:var(--muted)}

/* section heads */
.sec{margin-top:72px;display:flex;flex-direction:column;gap:22px}
.sec-head{position:relative;display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:3px solid var(--accent)}
.sec-head::before{content:"";position:absolute;top:-3px;inset-inline-start:0;width:72px;height:3px;background:var(--rasp)}
.sec-head h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.4vw,46px);line-height:1.3}
html[lang="en"] .sec-head h2{font-weight:500;line-height:1.1}
.sec-head .alt{font-size:18px;color:var(--muted)}
.note{font-size:14.5px;color:var(--muted);margin:0;max-width:60em}

/* lab */
.lab-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:32px;align-items:start}
.controls{display:flex;flex-direction:column;gap:22px}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:0 0 10px}
.choices{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.choice{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);padding:12px 4px;text-align:start;font:inherit;cursor:pointer;min-height:48px}
.choice:hover{background:var(--paper-2)}
.choice .rad{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;margin-top:4px;display:grid;place-items:center}
.choice[aria-pressed="true"] .rad::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.choice[aria-pressed="true"]{background:var(--accent-soft)}
.choice b{display:block;font-size:16.5px}
.choice span.s{display:block;font-size:14px;color:var(--muted);line-height:1.45}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice:disabled:hover{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--rule);padding:20px;display:flex;flex-direction:column;gap:16px}
.panel-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 12px var(--mono);letter-spacing:.12em;color:var(--muted)}
.clock{display:grid;gap:6px}
.clocktxt{display:flex;justify-content:space-between;font-size:14.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.clocktxt #clk{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.clocktxt .phase{font-weight:700}
.phase.on{color:var(--bad-ink)}
.bar{direction:ltr;position:relative;height:8px;background:var(--paper-2);overflow:hidden}
.bar .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--band) 0 4px,transparent 4px 8px);border-left:1px solid var(--bad);border-right:1px solid var(--bad)}
.bar .fill{position:absolute;top:0;bottom:0;left:0;background:var(--ink)}
svg.corr{width:100%;height:auto;display:block}
.ends{display:flex;justify-content:space-between;direction:ltr;font-size:13px;color:var(--muted);font-weight:600;margin-top:-8px}
.readings{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;direction:ltr}
.rd{padding:8px 6px 10px;border:1px solid var(--rule);background:var(--paper);font-size:13px;line-height:1.35;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.rd .z{font-weight:700;color:var(--muted);font-size:12.5px}
.rd .k{color:var(--muted);font-size:11.5px}
.rd .v{font:500 18px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.rd.good{border-color:var(--rule)}
.rd.badz{border:2px solid var(--bad);background:var(--bad-soft)}
.badge{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:2px}
.b-primary{background:var(--ok-soft);color:var(--ok-ink)}
.b-held{background:var(--wait-soft);color:var(--wait-ink)}
.b-none{background:var(--bad-soft);color:var(--bad-ink);box-shadow:inset 0 0 0 1px var(--bad)}
.b-backup{background:var(--backup-soft);color:var(--backup-ink)}
.b-neighbours{background:var(--guess-soft);color:var(--guess-ink)}
.verdict{padding:14px 16px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.verdict.good{background:var(--ok-soft);color:var(--ok-ink)}
.verdict.badv{background:var(--bad-soft);color:var(--bad-ink)}
.verdict small{font:500 14px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .sw{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:2px;font:700 12px var(--mono);font-style:normal}

/* results */
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 48px}
.chart{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--ink)}
.chart h3{font-size:17px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.chart h3 small{font:400 22px/1 var(--pixel);color:var(--rasp);letter-spacing:.02em}
html[lang="ar"] .chart h3 small{font:700 16px/1 var(--sans)}
.brow{display:grid;grid-template-columns:128px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:15px}
.track{position:relative;height:26px;background:var(--paper-2)}
.track .g{position:absolute;top:0;bottom:0;width:1px;background:var(--paper)}
.track .ref{position:absolute;top:-4px;bottom:-4px;width:0;border-inline-start:2px dashed var(--ink);z-index:1;opacity:.7}
.refnote{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);grid-column:1/-1}
.refnote i{display:inline-block;width:22px;border-top:2px dashed var(--ink);opacity:.7}
.track .fl{position:absolute;top:0;bottom:0;inset-inline-start:0;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.f-none{background:var(--bad)}.f-redundancy{background:var(--backup)}.f-fallback{background:var(--guess)}
.brow .n{font:500 15px var(--mono);font-variant-numeric:tabular-nums;text-align:end}
.ticks{position:relative;height:18px;font:400 11.5px var(--mono);color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
[dir="rtl"] .ticks span{transform:translateX(50%)}

/* findings */
ul.learn{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink);max-width:62em}
ul.learn li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--rule);font-size:18px;line-height:1.7}
ul.learn li::before{content:"";width:9px;height:9px;margin-top:.75em;background:var(--accent)}
ul.learn li:nth-child(4)::before{background:var(--rasp)}
ul.learn li:last-child{font-family:var(--display);font-size:clamp(22px,2.2vw,28px);line-height:1.5;color:var(--accent);border-bottom:0}
html[lang="en"] ul.learn li:last-child{font-style:italic;line-height:1.3}

.orn{display:flex;align-items:center;gap:16px;margin-block:56px 20px}
.orn span{flex:1;height:1px;background:var(--rule)}
.foot{display:flex;flex-wrap:wrap;gap:12px 48px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.foot p{flex:3 1 420px;min-width:0;margin:0}
.foot p.alt{flex:2 1 320px}

/* ===== Story view ===== */
.sv{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;display:grid;grid-template-rows:auto 1fr auto}
.sv[hidden]{display:none}
.sv-top{display:flex;align-items:center;gap:18px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ink)}
.sv-mark{font:400 28px/1 var(--pixel);color:var(--accent)}
.sv-prog{flex:1;display:flex;gap:4px}.sv-prog i{flex:1;height:3px;background:var(--rule);transition:background .3s}.sv-prog i.on{background:var(--accent)}
.sv-x{min-height:44px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;padding:6px 8px}
.sv-x:hover{color:var(--ink)}
.sv-main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:center;max-width:1240px;width:100%;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sv-text{display:flex;flex-direction:column;gap:16px;min-width:0;animation:rise .45s ease both}
.sv-eye{font:500 12.5px var(--mono);letter-spacing:.12em;color:var(--rasp);text-transform:uppercase}
.sv-h{font-family:var(--display);font-size:clamp(32px,4.2vw,56px);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
html[lang="en"] .sv-h{font-weight:500;line-height:1.08}
.sv-p{font-size:clamp(17px,1.6vw,20px);line-height:1.7;margin:0;max-width:34em}
.sv-note{font-size:13.5px;color:var(--muted);padding-top:10px;border-top:1px solid var(--rule)}
.sv-q{font-size:20px;font-weight:700;margin:6px 0 0}
.sv-opts{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.sv-opt{display:flex;align-items:center;gap:14px;text-align:start;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);padding:14px 6px;font-size:17px;font-weight:500;cursor:pointer;min-height:54px}
.sv-opt:hover{background:var(--paper-2)}
.sv-opt .ic{width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:500 14px var(--mono);flex:none}
.sv-opt.pick{background:var(--accent-soft);font-weight:700}
.sv-opt.pick .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sv-opt:disabled{cursor:default}
.sv-opt:disabled:not(.pick){color:var(--muted)}
.sv-opt:disabled:hover:not(.pick){background:transparent}
.sv-reveal{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:2px solid var(--ink);font-size:17px;line-height:1.65;animation:rise .4s ease both}
.sv-lesson{font-family:var(--display);font-weight:700;color:var(--accent);font-size:clamp(21px,2vw,26px);line-height:1.45}
html[lang="en"] .sv-lesson{font-weight:500;font-style:italic;line-height:1.25}
.sv-stage{position:relative;min-width:0}
.sv-stage canvas{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--rule)}
.sv-chart{display:flex;flex-direction:column;gap:28px;background:var(--surface);border:1px solid var(--rule);padding:24px}
.sv-final{font-family:var(--display);font-size:clamp(24px,2.6vw,34px);font-weight:700;line-height:1.4;color:var(--accent);margin:0}
html[lang="en"] .sv-final{font-weight:500;font-style:italic;line-height:1.2}
.sv-nav{display:flex;justify-content:space-between;gap:10px;padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;margin:0 auto}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sv-text,.sv-reveal{animation:none}.track .fl{transition:none}}

@media (max-width:900px){.lab-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.sv-main{grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}.sv-stage{order:-1}.sv-h{font-size:32px}}
@media (max-width:720px){
  .steps,.res{grid-template-columns:minmax(0,1fr)}

  .readings{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brow{grid-template-columns:96px minmax(0,1fr) 52px;font-size:14px}
  .panel{padding:14px}
  .alt-lead{padding-inline-start:0;border-inline-start:0;padding-top:16px;border-top:1px solid var(--rule)}
}

/* ===== Model (same rules as the Python code) ===== */
const WID=[20,20,20,19,18,17], AREA=WID.map(w=>w*10);
const C={Z:6,V0:0.60,RM:10.79,G:0.35,T:1800,DS:600,DE:900,NOISE:0.2,FAILED:[4],ERR_OK:0.5,STALE:3,INFLOW:18};
const SCEN={baseline:{type:"none",sev:0},sensor:{type:"sensor",sev:1},loss50:{type:"loss",sev:.5}};
function speed(r){if(r<=0)return C.V0;if(r>=C.RM)return 0;return C.V0*(1-Math.exp(-C.G*(C.RM/r-1)));}
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function newRun(o){const z=()=>new Array(C.Z).fill(0),n=()=>new Array(C.Z).fill(null),b=()=>new Array(C.Z).fill(1e6);
  return{o,t:0,rng:rngFrom(o.seed*7919+11),people:z(),truth:z(),est:n(),src:new Array(C.Z).fill("none"),
    lastP:n(),ageP:b(),lastB:n(),ageB:b(),okZ:new Array(C.Z).fill(true),bad:0,badWin:0};}
function step(s){
  const {o}=s,r=s.rng,sc=SCEN[o.scenario],t=s.t;
  const rho=s.people.map((p,i)=>p/AREA[i]),cap=AREA.map(a=>C.RM*0.98*a);
  const out=rho.map((d,i)=>Math.min(s.people[i],d*speed(d)*WID[i]));
  for(let i=0;i<C.Z-1;i++)out[i]=Math.min(out[i],Math.max(0,cap[i+1]-s.people[i+1]));
  let inn=C.INFLOW*Math.min(1,t/120)*(1+0.1*gauss(r));inn=Math.max(0,Math.min(inn,cap[0]-s.people[0]));
  for(let i=0;i<C.Z;i++){s.people[i]-=out[i];if(i>0)s.people[i]+=out[i-1];}
  s.people[0]+=inn;
  s.truth=s.people.map((p,i)=>p/AREA[i]);
  const win=t>=C.DS&&t<C.DE,loss=(win&&sc.type==="loss")?sc.sev:0;
  const prim=s.truth.map((d,i)=>(win&&sc.type==="sensor"&&C.FAILED.includes(i))?null:Math.max(0,d+C.NOISE*gauss(r)));
  const back=s.truth.map(d=>Math.max(0,d+C.NOISE*gauss(r)));
  const pRx=prim.map(v=>v===null?null:(r()<loss?null:v)),bRx=back.map(v=>r()<loss?null:v);
  s.tx={prim,pRx,bRx};
  const shP=[],shB=[];
  for(let i=0;i<C.Z;i++){
    if(pRx[i]!==null){s.lastP[i]=pRx[i];s.ageP[i]=0;}else s.ageP[i]++;
    if(bRx[i]!==null){s.lastB[i]=bRx[i];s.ageB[i]=0;}else s.ageB[i]++;
    shP[i]=s.ageP[i]<C.STALE?s.lastP[i]:null;shB[i]=s.ageB[i]<C.STALE?s.lastB[i]:null;
  }
  let ok=0;
  for(let i=0;i<C.Z;i++){
    let e=shP[i],src=s.ageP[i]===0?"primary":(e!==null?"held":"none");
    const det=s.ageP[i]>=C.STALE;
    if(det&&o.mechanism==="redundancy"&&shB[i]!==null){e=shB[i];src="backup";}
    if(det&&o.mechanism==="fallback"){const nb=[shP[i-1],shP[i+1]].filter(v=>v!==null&&v!==undefined);if(nb.length){e=nb.reduce((a,b)=>a+b,0)/nb.length;src="neighbours";}}
    s.est[i]=e;s.src[i]=src;
    s.okZ[i]=e!==null&&Math.abs(e-s.truth[i])<C.ERR_OK; if(s.okZ[i])ok++;
  }
  if(ok<C.Z){s.bad++;if(win)s.badWin++;}
  s.t++;
}

function reset(){const s=newRun({scenario:st.scenario,mechanism:st.mechanism,seed:st.seed});while(s.t<START)step(s);s.bad=0;st.run=s;draw();labels();}
function tick(){const s=st.run,n=st.fast?6:2;for(let k=0;k<n&&s.t<END;k++)step(s);
  for(let i=0;i<6;i++)st.drift[i]+=speed(s.truth[i])*.05*(st.fast?2:1);
  draw();if(s.t>=END)stop();}
function play(){if(st.run.t>=END)reset();st.playing=true;clearInterval(st.timer);st.timer=setInterval(tick,100);labels();}
function stop(){st.playing=false;clearInterval(st.timer);labels();}
function heat(d){return d<1.5?css("--h0"):d<2.5?css("--h1"):d<3.5?css("--h2"):css("--h3");}

function draw(){
  const s=st.run,tx=T(),t=s.t;
  $("clk").textContent=tx.clk(Math.floor(t/60),String(t%60).padStart(2,"0"));
  const base=st.scenario==="baseline",win=!base&&t>=C.DS&&t<C.DE;
  const ph=$("phase");ph.textContent=base?"":(t<C.DS?tx.before:win?tx.during:tx.after);ph.className="phase"+(win?" on":"");
  const span=END-START;$("fill").style.width=((t-START)/span*100)+"%";
  const band=$("band");band.style.display=base?"none":"block";
  band.style.left=((C.DS-START)/span*100)+"%";band.style.width=((C.DE-C.DS)/span*100)+"%";
  /* corridor: each zone's height follows its real width; pilgrims walk left → right */
  const zw=100,maxH=130,top=5,dot=css("--dot"),ink=css("--ink");let g="";
  for(let i=0;i<6;i++){
    const h=maxH*WID[i]/20,y=top+(maxH-h)/2,x=i*zw;
    g+=`<rect x="${x+.5}" y="${y}" width="${zw}" height="${h}" fill="${heat(s.truth[i])}" stroke="${ink}" stroke-width=".8"/>`;
    const n=Math.min(150,Math.round(s.people[i]/4));
    for(let k=0;k<n;k++){const[a,b,v]=DOTS[i][k],ax=(a+st.drift[i]*v)%1;g+=`<circle cx="${(x+5+ax*(zw-10)).toFixed(1)}" cy="${(y+5+b*(h-10)).toFixed(1)}" r="2.1" fill="${dot}" opacity=".72"/>`;}
  }
  $("corr").innerHTML=g;
  let html="";
  for(let i=0;i<6;i++){
    const e=s.est[i],ok=s.okZ[i],src=s.src[i];
    html+=`<div class="rd ${ok?"good":"badz"}" dir="${lang==="ar"?"rtl":"ltr"}"><div class="z">${tx.zone} ${i+1}</div><div class="k">${tx.real}</div><div class="v">${s.truth[i].toFixed(1)}</div><div class="k">${tx.screen}</div><div class="v">${e===null?"—":e.toFixed(1)} ${ok?"✓":"✗"}</div><span class="badge b-${src}">${GLYPH[src]} ${tx.st[src]}</span></div>`;
  }
  $("readings").innerHTML=html;
  const nb=s.okZ.filter(x=>!x).length,v=$("verdict");
  v.className="verdict "+(nb?"badv":"good");
  v.innerHTML=`<span>${nb?tx.someBad(nb):tx.allOk}</span><small>${tx.wrongSec(s.bad)}</small>`;
}

/* ===== Results: from the Python study (30 runs each, figures/table_rq2.csv, seconds_below_mean) ===== */
const RES={sensor:{none:298,redundancy:21,fallback:18},loss50:{none:172,redundancy:47,fallback:42}};
const RES_BASE=21; /* no disruption: seconds wrong from sensor noise alone (tolerance 0.5 p/m2) */
function computeResults(){}
function chartHTML(t,anim,label){
  const ticks=[0,100,200,300];
  return ["sensor","loss50"].map((sc,ci)=>`<div class="chart"><h3>${label?`<small>${label[ci]}</small>`:""}${t.resProb[sc]}</h3>`+
    ["none","redundancy","fallback"].map(me=>{const w=Math.max(1,RES[sc][me]/300*100);
      return `<div class="brow"><span>${t.fixes[me][0]}</span><div class="track">${[1,2].map(j=>`<i class="g" style="inset-inline-start:${j*100/3}%"></i>`).join("")}${`<i class="ref" style="inset-inline-start:${RES_BASE/3}%"></i>`}<div class="fl f-${me}" ${anim?`data-w="${w}"`:`style="width:${w}%"`}></div></div><span class="n">${RES[sc][me]} ${t.sec}</span></div>`;}).join("")+
    `<div class="brow" aria-hidden="true"><span></span><div class="ticks">${ticks.map(v=>`<span style="inset-inline-start:${v/3}%">${v}</span>`).join("")}</div><span></span></div></div>`).join("");
}

  const f=e.target.closest("[data-f]");if(f&&!f.disabled){st.mechanism=f.dataset.f;stop();reset();choiceButtons();play();return;}
});
$("play").onclick=()=>st.playing?stop():play();
$("fast").onclick=()=>{st.fast=!st.fast;labels();};

/* ===== Figure 1: the corridor, live (a normal day from the same model) ===== */
const REDUCED=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}})();
const hero={run:null,parts:null,last:0,acc:0,raf:0,vis:true};
let TKH=null;
function heroStart(){const s=newRun({scenario:"baseline",mechanism:"none",seed:3});while(s.t<300)step(s);hero.run=s;
  if(!hero.parts){const r=rngFrom(11);hero.parts=WID.map(()=>Array.from({length:160},()=>({x:r(),y:r(),v:.6+.8*r()})));}}
function heroCaption(){const s=hero.run;if(!s)return;const tx=T();$("heroClk").textContent=`${tx.probs.baseline[0]} · ${tx.clk(Math.floor(s.t/60),String(s.t%60).padStart(2,"0"))}`;}
function heroDraw(dt,move){
  const el=$("heroCv");if(!el||!hero.run)return;const s=hero.run,k=TKH||(TKH=svTokens());
  const W=1200,H=500,dpr=Math.min(2,window.devicePixelRatio||1);
  if(el.width!==W*dpr||el.height!==H*dpr){el.width=W*dpr;el.height=H*dpr;}
  const g=el.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const cy=220;
  for(let i=0;i<6;i++){
    const hh=WID[i]/20*110,x=90+i*170,y=cy-hh,d=s.truth[i];
    g.fillStyle=d<1.5?k.h[0]:d<2.5?k.h[1]:d<3.5?k.h[2]:k.h[3];g.fillRect(x,y,170,2*hh);
    g.strokeStyle=k.ink;g.lineWidth=1.3;g.strokeRect(x,y,170,2*hh);
    const n=Math.min(160,Math.round(s.people[i]/4)),v=speed(d);g.fillStyle=k.dot;g.globalAlpha=.74;
    for(let j=0;j<n;j++){const p=hero.parts[i][j];if(move)p.x=(p.x+v*p.v*dt/2600)%1;
      g.beginPath();g.arc(x+8+p.x*154,y+8+p.y*(2*hh-44),2.4,0,7);g.fill();}
    g.globalAlpha=1;
    const sx=x+85,sy=cy+hh-24;
    g.fillStyle=k.sf;g.strokeStyle=k.acc;g.lineWidth=1.6;g.beginPath();g.arc(sx,sy,6.5,0,7);g.fill();g.stroke();
    g.fillStyle=k.acc;g.beginPath();g.arc(sx,sy,2.4,0,7);g.fill();
    g.fillStyle=k.mut;g.font='500 12.5px "IBM Plex Mono", ui-monospace, monospace';g.textAlign="center";g.fillText(`Z${i+1} · ${d.toFixed(1)}`,sx,y-10);
  }
}
function heroTick(now){
  if(sv.open||!hero.vis){hero.raf=0;return;}
  const dt=Math.min(80,now-(hero.last||now));hero.last=now;
  hero.acc+=dt;
  while(hero.acc>=STEP_MS){hero.acc-=STEP_MS;step(hero.run);if(hero.run.t>=900)heroStart();heroCaption();}
  heroDraw(dt,true);
  hero.raf=requestAnimationFrame(heroTick);
}
function heroResume(){if(REDUCED||hero.raf||sv.open||!hero.vis)return;hero.last=0;hero.raf=requestAnimationFrame(heroTick);}
try{new IntersectionObserver(es=>{hero.vis=es[0].isIntersecting;if(hero.vis)heroResume();}).observe($("heroFig"));}catch(e){}

const SV={

 {h:"الآن ضعفت الشبكة نفسها",q:"تضيع نصف الرسائل في الطريق. فهل يكفي الحسّاس الاحتياطي؟",opts:["نعم، يكفي","لا، لا يكفي"],reveal:"تمرّ رسائل الحسّاس الاحتياطي عبر الشبكة نفسها، فتضيع هي أيضًا. لاحظ الرسائل وهي تتلاشى في منتصف الطريق، وعدّاد الخطأ وهو يرتفع.",lesson:"البديل الذي يعتمد على الشبكة نفسها يتأثر بضعفها"},

const SCN=[
 {scen:"baseline",mech:"none",t0:300,sensors:false},
 {scen:"baseline",mech:"none",t0:300,sensors:false},
 {scen:"baseline",mech:"none",t0:300,sensors:true},
 {scen:"sensor",mech:"none",t0:594,sensors:true,ask:true},
 {scen:"sensor",mech:null,t0:594,sensors:true,ask:true},
 {scen:"loss50",mech:"redundancy",t0:594,sensors:true,ask:true,count:true},
 {chart:true}];
const sv={i:0,ans:null,run:null,parts:[],msgs:[],last:0,acc:0,raf:0,mech:"none",open:false};
const STEP_MS=320;
const cv=()=>document.getElementById("svc");
function svTokens(){const g=v=>css(v);return{bg:g("--paper"),sf:g("--surface"),ink:g("--ink"),mut:g("--muted"),line:g("--rule"),acc:g("--accent"),ok:g("--ok"),bad:g("--bad"),wait:g("--wait"),bk:g("--backup"),gs:g("--guess"),h:[g("--h0"),g("--h1"),g("--h2"),g("--h3")],dot:g("--dot")};}
let TK=null;
function svStartRun(){
  const c=SCN[sv.i];if(c.chart)return;
  const s=newRun({scenario:c.scen,mechanism:sv.mech,seed:3});
  while(s.t<c.t0)step(s);s.bad=0;sv.run=s;sv.msgs=[];sv.acc=0;
  /* fixed jitter for pilgrims: up to 160 per zone */
  if(!sv.parts.length){const r=rngFrom(9);sv.parts=WID.map(()=>Array.from({length:160},()=>({x:r(),y:r(),v:.6+.8*r()})));}
}
function svPlaying(){const c=SCN[sv.i];return !c.chart&&(!c.ask||sv.ans!==null);}
function svTick(now){
  if(!sv.open)return;
  const dt=Math.min(80,now-(sv.last||now));sv.last=now;
  const c=SCN[sv.i];
  if(!c.chart&&sv.run){
    if(svPlaying()){sv.acc+=dt;
      while(sv.acc>=STEP_MS){sv.acc-=STEP_MS;step(sv.run);svEmit(now);
        if(sv.run.t>=C.DE+25){svStartRun();break;}}}
    svDraw(now,dt);
  }
  sv.raf=requestAnimationFrame(svTick);
}
function svEmit(now){
  const s=sv.run,c=SCN[sv.i];if(!c.sensors||!s.tx)return;
  for(let i=0;i<6;i++){
    if(s.tx.prim[i]!==null)sv.msgs.push({i,k:"p",lost:s.tx.pRx[i]===null,t0:now});
    if(sv.mech==="redundancy"&&s.ageP[i]>=C.STALE-1)sv.msgs.push({i,k:"b",lost:s.tx.bRx[i]===null,t0:now});
  }
}
function svDraw(now,dt){
  const el=cv();if(!el)return;const s=sv.run,c=SCN[sv.i],tx=SV[lang],k=TK||(TK=svTokens());
  const W=640,H=c.sensors?430:250,dpr=Math.min(2,window.devicePixelRatio||1);
  if(el.width!==W*dpr||el.height!==H*dpr){el.width=W*dpr;el.height=H*dpr;}
  const g=el.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const FACE=lang==="ar"?'"IBM Plex Sans Arabic", system-ui, sans-serif':'"IBM Plex Sans", system-ui, sans-serif';
  const F=w=>`${w} 13px ${FACE}`;
  const x0=20,zw=100,cy=118,maxH=150;
  g.fillStyle=k.mut;g.font=F(700);g.textAlign="left";g.fillText(tx.reality,x0,26);
  const win=s.t>=C.DS&&s.t<C.DE&&c.scen!=="baseline";
  if(win){g.fillStyle=k.bad;g.textAlign="right";g.fillText("● "+tx.fault,W-20,26);}
  /* zones */
  for(let i=0;i<6;i++){
    const h=maxH*WID[i]/20,y=cy-h/2,x=x0+i*zw,d=s.truth[i];
    g.fillStyle=d<1.5?k.h[0]:d<2.5?k.h[1]:d<3.5?k.h[2]:k.h[3];
    g.fillRect(x,y,zw,h);g.strokeStyle=k.ink;g.lineWidth=1;g.strokeRect(x,y,zw,h);
    /* pilgrims drift right at the zone's walking speed */
    const n=Math.min(160,Math.round(s.people[i]/4)),v=speed(d);g.fillStyle=k.dot;g.globalAlpha=.72;
    for(let j=0;j<n;j++){const p=sv.parts[i][j];if(svPlaying())p.x=(p.x+v*p.v*dt/2600)%1;
      g.beginPath();g.arc(x+6+p.x*(zw-12),y+6+p.y*(h-12),2.3,0,7);g.fill();}
    g.globalAlpha=1;
  }
  g.fillStyle=k.mut;g.font=F(500);g.textAlign="left";g.fillText(tx.entry,x0,cy+maxH/2+20);
  g.textAlign="right";g.fillText(tx.exit,x0+6*zw,cy+maxH/2+20);
  if(!c.sensors)return;
  /* sensors */
  const sy=cy+maxH/2+40,ty=300,th=96;
  for(let i=0;i<6;i++){
    const x=x0+i*zw+zw/2,broken=win&&c.scen==="sensor"&&i===4;
    g.fillStyle=broken?k.bad:k.acc;g.beginPath();g.arc(x,sy,9,0,7);g.fill();
    g.strokeStyle=k.sf;g.lineWidth=2;g.beginPath();
    if(broken){g.moveTo(x-4,sy-4);g.lineTo(x+4,sy+4);g.moveTo(x+4,sy-4);g.lineTo(x-4,sy+4);}
    else{g.arc(x,sy,4,0,7);}g.stroke();
    if(sv.mech==="redundancy"&&win){g.fillStyle=k.bk;g.beginPath();g.arc(x+16,sy,6,0,7);g.fill();}
  }
  /* messages */
  sv.msgs=sv.msgs.filter(m=>now-m.t0<520);
  for(const m of sv.msgs){const p=(now-m.t0)/520,x=x0+m.i*zw+zw/2+(m.k==="b"?16:0),y=sy+(ty-sy)*p;
    if(m.lost&&p>.5){const q=(p-.5)*2;g.strokeStyle=k.bad;g.globalAlpha=1-q;g.lineWidth=2;
      const ym=sy+(ty-sy)*.5;for(let a=0;a<6;a++){const an=a*Math.PI/3;g.beginPath();g.moveTo(x+Math.cos(an)*4,ym+Math.sin(an)*4);g.lineTo(x+Math.cos(an)*(5+10*q),ym+Math.sin(an)*(5+10*q));g.stroke();}
      g.globalAlpha=1;continue;}
    g.fillStyle=m.k==="b"?k.bk:k.acc;g.beginPath();g.arc(x,y,4,0,7);g.fill();}
  /* neighbour arrows */
  for(let i=0;i<6;i++)if(s.src[i]==="neighbours"){g.strokeStyle=k.gs;g.lineWidth=2;g.setLineDash([4,4]);
    for(const j of[i-1,i+1])if(j>=0&&j<6){g.beginPath();g.moveTo(x0+j*zw+zw/2,ty+th/2);g.lineTo(x0+i*zw+zw/2+(j<i?-22:22),ty+th/2);g.stroke();}g.setLineDash([]);}
  /* monitor */
  g.fillStyle=k.mut;g.font=F(700);g.textAlign="left";g.fillText(tx.monitor,x0,ty+th+22);
  if(c.count){g.textAlign="right";g.fillStyle=s.bad?k.bad:k.mut;g.font=F(700);g.fillText(tx.wrong(s.bad),W-20,ty+th+22);}
  const col={primary:k.ok,held:k.wait,none:k.bad,backup:k.bk,neighbours:k.gs};
  for(let i=0;i<6;i++){
    const x=x0+i*zw+4,w=zw-8,e=s.est[i],src=s.src[i],ok=s.okZ[i];
    g.fillStyle=ok?k.bg:"rgba(187,54,83,.12)";g.beginPath();g.rect(x,ty,w,th);g.fill();
    g.strokeStyle=ok?col[src]:k.bad;g.lineWidth=ok?1.5:3;g.beginPath();g.rect(x,ty,w,th);g.stroke();
    g.textAlign="center";g.fillStyle=e===null?k.bad:k.ink;g.font='500 26px "IBM Plex Mono", ui-monospace, monospace';
    g.fillText(e===null?"?":e.toFixed(1),x+w/2,ty+42);
    g.font=F(700);g.fillStyle=col[src];g.fillText(GLYPH[src]+" "+(src==="held"?`${tx.st.held} ${Math.max(0,C.STALE-s.ageP[i])}`:tx.st[src]),x+w/2,ty+64);
    g.font=F(500);g.fillStyle=k.mut;g.fillText(`${tx.real} ${s.truth[i].toFixed(1)}`,x+w/2,ty+84);
  }
}
function svRender(){
  const tx=SV[lang],c=SCN[sv.i],sc=tx.sc[sv.i],n=tx.sc.length;
  document.getElementById("svProg").innerHTML=tx.sc.map((_,j)=>`<i class="${j<=sv.i?"on":""}"></i>`).join("");
  document.getElementById("svX").textContent=tx.close;
  let h=`<div class="sv-eye">${tx.of(sv.i+1,n)}</div><h2 class="sv-h">${sc.h}</h2>`;
  if(sc.p)h+=`<p class="sv-p">${sc.p}</p>`;
  if(sc.q){h+=`<p class="sv-q">${sc.q}</p><div class="sv-opts">`+sc.opts.map((o,j)=>`<button class="sv-opt${sv.ans===j?" pick":""}" data-svans="${j}" ${sv.ans!==null?"disabled":""}><span class="ic">${j+1}</span>${o}</button>`).join("")+`</div>`;
    if(sv.ans!==null)h+=`<div class="sv-reveal"><span>${sc.reveal}</span><div class="sv-lesson">${sc.lesson}</div></div>`;}
  else if(sc.lesson)h+=`<div class="sv-reveal"><div class="sv-lesson">${sc.lesson}</div></div>`;
  if(sc.note)h+=`<div class="sv-note">${sc.note}</div>`;
  if(c.chart){h+=`<p class="sv-final">${sc.final}</p><div class="row"><button class="btn" data-svgo="play">${sc.play}</button><button class="btn ghost" data-svgo="again">${sc.again}</button></div>`;}
  document.getElementById("svText").innerHTML=h;
  const stage=document.getElementById("svStage");
  if(c.chart){const t=T();
    stage.innerHTML=`<div class="sv-chart">${chartHTML(t,true,"")}<p class="refnote"><i aria-hidden="true"></i>${t.refLine}</p></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>stage.querySelectorAll("[data-w]").forEach(d=>d.style.width=d.dataset.w+"%")));}
  else if(!document.getElementById("svc"))stage.innerHTML=`<canvas id="svc" role="img" aria-label="corridor and monitoring screen"></canvas>`;
  const back=document.getElementById("svBack"),next=document.getElementById("svNext");
  back.textContent=tx.back;next.textContent=tx.next;back.disabled=sv.i===0;
  next.disabled=sv.i===n-1||(c.ask&&sv.ans===null);
}
function svGo(i){
  sv.i=Math.max(0,Math.min(SCN.length-1,i));sv.ans=null;
  const c=SCN[sv.i];sv.mech=c.mech||"none";
  if(!c.chart&&document.getElementById("svStage").querySelector(".sv-chart"))document.getElementById("svStage").innerHTML="";
  svRender();svStartRun();document.getElementById("sv").scrollTop=0;
}
function svOpen(i){stop();TK=null;sv.open=true;document.getElementById("sv").hidden=false;document.body.style.overflow="hidden";svGo(i);cancelAnimationFrame(sv.raf);sv.last=0;sv.raf=requestAnimationFrame(svTick);}
function svClose(){sv.open=false;cancelAnimationFrame(sv.raf);document.getElementById("sv").hidden=true;document.body.style.overflow="";heroResume();}
function svRoute(){const h=location.hash;if(h==="#story")svOpen(0);else if(h==="#result")svOpen(SCN.length-1);else if(sv.open)svClose();}
document.addEventListener("click",e=>{
  if(e.target.closest("#startStory")){location.hash="story";if(!sv.open)svRoute();}
  else if(e.target.closest("#quick")){location.hash="result";if(!sv.open)svRoute();}
  else if(e.target.closest("#svX")){location.hash="";svClose();}
  else if(e.target.closest("#svNext"))svGo(sv.i+1);
  else if(e.target.closest("#svBack"))svGo(sv.i-1);
  else if(e.target.closest("[data-svans]")){const j=+e.target.closest("[data-svans]").dataset.svans;sv.ans=j;
    const m=SV.en.sc[sv.i].mech;if(m){sv.mech=m[j];svStartRun();}svRender();}
  else if(e.target.closest("[data-svgo]")){const a=e.target.closest("[data-svgo]").dataset.svgo;
    if(a==="again")svGo(0);else{location.hash="";svClose();document.querySelector(".demo").scrollIntoView({behavior:"smooth"});}}
});
document.addEventListener("keydown",e=>{if(!sv.open)return;
  const fwd=lang==="ar"?"ArrowLeft":"ArrowRight",bwd=lang==="ar"?"ArrowRight":"ArrowLeft";
  if(e.key===fwd&&!document.getElementById("svNext").disabled)svGo(sv.i+1);
  else if(e.key===bwd&&sv.i>0)svGo(sv.i-1);else if(e.key==="Escape"){location.hash="";svClose();}});
window.addEventListener("hashchange",svRoute);

computeResults();heroStart();reset();render();heroDraw(0,false);heroResume();svRoute();
try{document.fonts&&document.fonts.ready.then(()=>{if(!hero.raf)heroDraw(0,false);});}catch(e){}
</script>
